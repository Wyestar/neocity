<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The web site of gevurztraminer</title>
	<link href="../style.css" rel="stylesheet" type="text/css" media="all">
	<link href="./haleiwaWeather.css" rel="stylesheet" type="text/css" media="all">
	<link rel="icon" href="../favicon.ico" type="image/x-icon">
	<!--<meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob: https://api.open-meteo.com;">-->
</head>
<body>
	<!--<script src="env.js"></script>-->
	<div class="main-page">
		<header id="headerTarget" class="header">
			<!--<div id="bannerContainer" class="banner-container">
			</div>

			<div id="tabsContainer">
			</div>-->
		</header>

		<div id="subpageStart"></div>
			<div id="subpageTarget" class="torso">
				<div id="haleiwaWeatherSubpage">
					<div class="hw-title">
						<p>
							selected weather attributes of haleiwa, hawaii for a week for your viewing pleasure.
						</p>
						<div id="hwQuestion" class="hw-question">
							<p>why?</p>
						</div>
						<div id="hwReason" class="hw-reason"></div>
					</div>
					<div class="hw-section-container">
						<!--<div class="hw-menu container">
							<div>show only current day</div>
							<div>expand all</div>
						</div>-->
						<div class="hw-panels-container">
							<div id="hwPanelsWrapper" class="hw-panels-wrapper">
							</div>
						</div>
					</div>
				</div>
			</div>
		<div id="subpageEnd"></div>

		<footer id="footerTarget" class="footer"></footer>
	</div>

	<script type="module">
		// TODO; add more buttons to control panel display and change units of measurement
		let isOpen = false;
		const showReason = () => {
			const hwQuestionNode = document.getElementById("hwQuestion")
			const hwReasonNode = document.getElementById("hwReason");
			if (!isOpen) {
				hwReasonNode.textContent = "my wife gets severe weather updates for hawaii from some old alert system. so i thought it would be neat to build a little something kinda like that. haleiwa is a cool place too, big recommend."
				hwQuestionNode.classList.remove("hw-question-closed")
				hwQuestionNode.classList.add("hw-question-open")
				isOpen = true;
			} else {
				hwReasonNode.textContent = ""
				isOpen = false;
				hwQuestionNode.classList.remove("hw-question-open")
				hwQuestionNode.classList.add("hw-question-closed")
			}
		}
		const hwQuestionNode = document.getElementById("hwQuestion")
		hwQuestionNode.addEventListener("click", showReason)

		import { getHwData, generateWeatherPerDayList, createDayNode }  from "../js/hwDataHandler.js"
		const hwData = await getHwData();
		const weatherPerDayList = generateWeatherPerDayList(hwData)

		const hwPanelsWrapperNode = document.getElementById("hwPanelsWrapper")
		weatherPerDayList.forEach((day) => {
			const dayNode = createDayNode(day);
			hwPanelsWrapperNode.appendChild(dayNode);
		})
	</script>

	<script type="module">
		import { getHeader, getFooter}  from "../js/headerAndFooter.js"
		getHeader();
		getFooter();
	</script>

</body>
</html>
