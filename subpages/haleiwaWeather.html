<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The web site of gevurztraminer</title>
	<link href="../style.css" rel="stylesheet" type="text/css" media="all">
	<link href="./haleiwaWeather.css" rel="stylesheet" type="text/css" media="all">
	<!--<meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob: https://api.open-meteo.com;">-->
</head>
<body>
	<script src="env.js"></script>
	<div class="main-page">
		<header id="headerTarget" class="header">
			<!--<div id="bannerContainer" class="banner-container">
			</div>

			<div id="tabsContainer">
			</div>-->
		</header>

		<div id="subpageStart"></div>
			<div id="subpageTarget" class="torso">
				<div id="haleiwaWeatherSubpage">
					<div class="hw-title">
						the weather of haleiwa, hawaii for a week for your viewing pleasure.
					</div>
					<div class="hw-section-container">
						<div class="hw-menu container">
							<div>show only current day</div>
							<div>expand all</div>
						</div>
						<div class="hw-panels-container">
							<div id="hwPanelsWrapper" class="hw-panels-wrapper">
							</div>
						</div>
					</div>
				</div>
			</div>
		<div id="subpageEnd"></div>

		<footer id="footerTarget" class="footer"></footer>
	</div>

	<!--scripts go here-->
	<script type="module">
		// TODO; there is a cli ruby gem for automated updates
		// om req => save res as json => upload file to nc
		import { getHwData, generateWeatherPerDayList, createDayNode }  from "../js/hwDataHandler.js"
		const hwData = await getHwData();
		console.log("hw mock data");
		console.log(hwData);

		// this takes JSON of weather data and parses it into an array of objects. each object is a day and its weather values, with units.
		const weatherPerDayList = generateWeatherPerDayList(hwData)
		console.log("weather per day test")
		console.log(weatherPerDayList);

		// given array of weather data, each index is an obj of a day.
		// construct nodes for display
		// default show mid-level data in horizontal panels layout
		// click on a day to expand that day and hide others.
		// want to animate panels.
		// highlighted panel ~60% width
		// TODO; expand all feature, show panels in vertical layout

		const hwPanelsWrapperNode = document.getElementById("hwPanelsWrapper")

		weatherPerDayList.forEach((day) => {
			const dayNode = createDayNode(day);
			// set in DOM when created
			hwPanelsWrapperNode.appendChild(dayNode);
		})
	</script>

	<script type="module">
		import { getHeader, getFooter}  from "../js/headerAndFooter.js"
		getHeader();
		getFooter();
	</script>

</body>
</html>
