<div id="haleiwaWeatherSubpage">
	weather of haleiwa

	<script>
	  const momo = new MutationObserver((mutations) => {
			mutations.forEach((mutation) => {
			  if (mutation.addedNodes.length) {
					const target = document.getElementById("haleiwaWeatherSubpage");
					if (target) {
					 	console.log("haleiwa weather check")

							// momo.disconnect();
					}
				}
			})
		})

		const subpageStartNode = document.getElementById("subpageTarget");
		momo.observe(subpageStartNode, { attributes: true, childList: true, subtree: true })


		const haleiwaRawData = () => {
			fetch("https://api.open-meteo.com/v1/forecast?latitude=21.58849&longitude=-158.11051&current=temperature_2m,precipitation,is_day,wind_speed_10m,wind_direction_10m,pressure_msl,surface_pressure,relative_humidity_2m,apparent_temperature,weather_code,cloud_cover")
				.then((response) => {
					console.log("haleiwa raw data", response);

					return response.json();
				})
		}

		const haleiwaWeatherSubpage = document.getElementById("haleiwaWeatherSubpage");

		if (haleiwaWeatherSubpage) {
		console.log("haleiwa node exists");
		console.log("haleiwa raw data", haleiwaRawData());
			// $(document).ready(haleiwaRawData())
		}

		// console.log("haleiwa raw data", haleiwaRawData());
	</script>
</div>
